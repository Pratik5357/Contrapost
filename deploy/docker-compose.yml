# Local stack: docker compose -f deploy/docker-compose.yml up -d --build
# No bind mounts, so it also works from folders Docker Desktop cannot share.
name: contrapost

x-app-env: &app-env
  ApiKeys__Environment: dev
  ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=contrapost;Username=contrapost;Password=contrapost;Gss Encryption Mode=Disable
  ConnectionStrings__RabbitMq: amqp://contrapost:contrapost@rabbitmq:5672

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: contrapost
      POSTGRES_USER: contrapost
      POSTGRES_PASSWORD: contrapost
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # TCP, so it only passes once the init-time temporary server has been replaced
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "contrapost", "-d", "contrapost"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      # The default guest user may only connect from localhost, not from other containers.
      RABBITMQ_DEFAULT_USER: contrapost
      RABBITMQ_DEFAULT_PASS: contrapost
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies migrations, then exits. api and worker start only after it succeeds.
  migrate:
    image: contrapost-api
    build:
      context: ..
      dockerfile: src/Contrapost.Api/Dockerfile
    command: ["migrate"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: contrapost-api
    environment: *app-env
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Hold expiry and the outbox relay
  worker:
    image: contrapost-worker
    build:
      context: ..
      dockerfile: src/Contrapost.Worker/Dockerfile
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  # Statement projector and low-balance notifier
  consumers:
    image: contrapost-consumers
    build:
      context: ..
      dockerfile: src/Contrapost.Consumers/Dockerfile
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

volumes:
  pgdata:
