name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Contrapost.slnx
      - name: Check formatting
        run: dotnet format Contrapost.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Contrapost.slnx --configuration Release --no-restore
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner)
      - name: Test
        run: dotnet test Contrapost.slnx --configuration Release --no-build --logger "console;verbosity=normal"

  images:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f src/Contrapost.Api/Dockerfile -t contrapost-api:${{ github.sha }} .
      - name: Build worker image
        run: docker build -f src/Contrapost.Worker/Dockerfile -t contrapost-worker:${{ github.sha }} .
      - name: Build consumers image
        run: docker build -f src/Contrapost.Consumers/Dockerfile -t contrapost-consumers:${{ github.sha }} .

  # Design doc §14: a 60-second smoke load test that fails the build if p99 or the error rate
  # crosses the thresholds in tests/load/ledger.js.
  smoke-load:
    name: Smoke load test (60 s)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Start the ledger services
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait api worker consumers
      - name: Run the mixed scenario
        run: DURATION=60s VUS=5 tests/load/run.sh mixed
      - name: Keep the k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: tests/load/results/
