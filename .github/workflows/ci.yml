name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Contrapost.slnx
      - name: Check formatting
        run: dotnet format Contrapost.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Contrapost.slnx --configuration Release --no-restore
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner)
      - name: Test
        run: dotnet test Contrapost.slnx --configuration Release --no-build --logger "console;verbosity=normal"

  images:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f src/Contrapost.Api/Dockerfile -t contrapost-api:${{ github.sha }} .
      - name: Build worker image
        run: docker build -f src/Contrapost.Worker/Dockerfile -t contrapost-worker:${{ github.sha }} .
      - name: Build consumers image
        run: docker build -f src/Contrapost.Consumers/Dockerfile -t contrapost-consumers:${{ github.sha }} .
      - name: Build admin dashboard image
        run: docker build -t contrapost-admin:${{ github.sha }} web/admin

  # The admin dashboard (design doc §5.2): type-check and production build.
  dashboard:
    name: Admin dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # Design doc §14: a 60-second smoke load test that fails the build if p99 or the error rate
  # crosses the thresholds in tests/load/ledger.js.
  smoke-load:
    name: Smoke load test (60 s)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Start the ledger services
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait api worker consumers
      - name: Run the mixed scenario
        run: DURATION=60s VUS=5 tests/load/run.sh mixed
      - name: Keep the k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: tests/load/results/

  # Design doc §5.2: Playwright smoke tests of the admin dashboard against the Compose stack
  # (log in, open an account, page its history, open a reconciliation run).
  dashboard-smoke:
    name: Dashboard smoke tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - name: Install dashboard dependencies and Chromium
        working-directory: web/admin
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start the ledger services and the dashboard
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait api worker consumers admin
      - name: Seed the ledger
        run: web/admin/e2e/seed.sh
      - name: Run the smoke tests
        working-directory: web/admin
        run: npm run test:e2e
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/admin/playwright-report/
            web/admin/test-results/
