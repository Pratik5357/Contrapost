name: benchmark

# The locking-strategy benchmark (design doc §8.1) on a dedicated runner, where nothing else competes for
# CPU. Runs when the strategies or the benchmark change, or on demand; results are uploaded as an artifact.
on:
  workflow_dispatch:
    inputs:
      workers: { description: Concurrent writers, default: "8" }
      seconds: { description: Measured seconds per cell, default: "10" }
  pull_request:
    paths:
      - "bench/**"
      - "src/Contrapost.Infrastructure/Ledger/LockingStrategies.cs"

jobs:
  locking:
    name: Locking strategies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run the benchmark
        run: |
          nproc; free -g | head -2
          dotnet run -c Release --project bench/Contrapost.Benchmarks -- \
            --workers "${{ inputs.workers || '8' }}" --seconds "${{ inputs.seconds || '10' }}" --out bench-results \
            | tee bench-results.log
      - uses: actions/upload-artifact@v4
        with:
          name: locking-benchmark
          path: |
            bench-results/
            bench-results.log
